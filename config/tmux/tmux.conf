# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
# bind \ split-window -h
bind-key \\ split-window -h -c '#{pane_current_path}'  # Split panes vertically
bind - split-window -v
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.config/tmux/tmux.conf
set-option -sa terminal-overrides ",xterm*:Tc"

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# switch panes using Alt-arrow without prefix
bind -n C-h select-pane -L
bind -n C-h select-pane -R
bind -n C-h select-pane -U
bind -n C-h select-pane -D


# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
setw -g word-separators ' @"=()[]\'
setw -ag word-separators "'"

# don't rename windows automatically
set-option -g allow-rename off

# pass OSC 8 hyperlinks through to the terminal
set -as terminal-features ',xterm*:hyperlinks'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin '2kabhishek/tmux2k'

# set -g @tmux2k-theme 'gruvbox'
set -g @tmux2k-theme "catppuccin-frappe"
set -g @tmux2k-left-plugins "session git"
set -g @tmux2k-session-colors "green text"
set -g @tmux2k-git-colors "purple text"
set -g @tmux2k-right-plugins "cpu ram battery time"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
